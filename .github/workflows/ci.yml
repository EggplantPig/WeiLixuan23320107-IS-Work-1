name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-scan:
    name: Test + SAST + SCA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests
        env:
          JWT_SECRET: ci-only-jwt-secret-0123456789abcdef
          SECRET_KEY: ci-only-jwt-secret-0123456789abcdef
        run: pytest -q

      - name: SAST - bandit
        run: |
          mkdir -p reports
          bandit -r app -f json -o reports/bandit.json
          bandit -r app -f txt -o reports/bandit.txt

      - name: SCA - safety (dependency vulnerability scan)
        run: |
          mkdir -p reports
          set -o pipefail
          safety check -r requirements.txt | tee reports/safety.txt

      - name: Publish scan summary
        if: always()
        run: |
          {
            echo "## Security scan summary"
            echo ""
            echo "### SAST - bandit"
            echo '```'
            tail -n 25 reports/bandit.txt 2>/dev/null || true
            echo '```'
            echo ""
            echo "### SCA - safety"
            echo '```'
            grep -E "No known security|vulnerabilities" reports/safety.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/
          if-no-files-found: ignore

  snyk:
    name: SCA - Snyk
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Snyk CLI
        run: npm install -g snyk snyk-to-html

      - name: Run Snyk dependency scan
        if: env.SNYK_TOKEN != ''
        run: |
          mkdir -p reports
          python -m pip install -r requirements.txt
          snyk test --file=requirements.txt --package-manager=pip --json-file-output=reports/snyk.json || true
          snyk-to-html -i reports/snyk.json -o reports/snyk-report.html || true

      - name: Explain skipped Snyk scan
        if: env.SNYK_TOKEN == ''
        run: |
          echo "::notice::SNYK_TOKEN is not configured; Snyk scan was skipped."
          echo "Add SNYK_TOKEN as a repository secret and re-run the workflow to enable it."

      - name: Upload Snyk report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: reports/
          if-no-files-found: ignore
