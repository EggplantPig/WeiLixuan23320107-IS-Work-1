name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-scan:
    name: Test + SAST + SCA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests
        env:
          JWT_SECRET: ci-only-jwt-secret-0123456789abcdef
          SECRET_KEY: ci-only-jwt-secret-0123456789abcdef
        run: pytest -q

      - name: SAST - bandit
        run: |
          mkdir -p reports
          bandit -r app -f json -o reports/bandit.json

      - name: SCA - safety (dependency vulnerability scan)
        run: |
          mkdir -p reports
          set -o pipefail
          safety check -r requirements.txt | tee reports/safety.txt

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/
          if-no-files-found: ignore
